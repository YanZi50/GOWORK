<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>局域网快传</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 11v5"/><path d="M9.5 13.5 12 11l2.5 2.5"/></svg>
      </span>
      <span class="brand-name">局域网快传</span>
      <span class="chip" id="serverName">…</span>
      <span class="chip chip-accent" id="localTag" hidden>本机管理</span>
    </div>
    <div class="top-actions">
      <span class="speed" id="speedBox">
        <span class="speed-chip" id="speedDown" title="本机下载速度（从局域网拉取）">↓ --</span>
        <span class="speed-chip" id="speedUp" title="本机上传速度（向局域网提供）">↑ --</span>
      </span>
      <span class="addr" id="addrText"></span>
      <button class="btn btn-ghost" id="themeBtn" type="button" title="切换亮/暗主题">
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn btn-ghost" id="qrBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14h1M14 20h1M18 18h3v3h-3z"/></svg>
        二维码
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-view="shares" type="button">共享文件夹</button>
    <button class="tab" data-view="peers" type="button">局域网设备<span class="count" id="peerCount"></span></button>
    <button class="tab" data-view="admin" id="adminTab" type="button" hidden>管理</button>
    <button class="tab" data-view="dlcenter" id="dlTab" type="button" hidden>下载中心<span class="dl-badge" id="dlBadge"></span></button>
  </nav>

  <main id="view" class="view"></main>
</div>

<!-- 密码弹窗 -->
<div class="modal" id="pwdModal" hidden>
  <div class="modal-card">
    <h3 class="modal-title">输入访问密码</h3>
    <p class="modal-desc" id="pwdDesc"></p>
    <form id="pwdForm">
      <input class="input" type="password" id="pwdInput" placeholder="该共享的访问密码" autocomplete="current-password" required>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close>取消</button>
        <button class="btn btn-primary" type="submit">解锁</button>
      </div>
    </form>
  </div>
</div>

<!-- 二维码弹窗 -->
<div class="modal" id="qrModal" hidden>
  <div class="modal-card">
    <h3 class="modal-title">用手机扫一扫，即可访问</h3>
    <p class="modal-desc" id="qrHint"></p>
    <div class="qr-box"><div id="qrCanvas"></div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" type="button" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- 预览弹窗 -->
<div class="modal" id="previewModal" hidden>
  <div class="modal-card modal-wide">
    <div class="modal-head">
      <h3 class="modal-title" id="previewTitle"></h3>
      <button class="btn btn-ghost btn-sm" type="button" data-close>关闭</button>
    </div>
    <div class="preview-body" id="previewBody"></div>
  </div>
</div>

<!-- 路径选择弹窗 -->
<div class="modal" id="pickModal" hidden>
  <div class="modal-card modal-wide">
    <div class="modal-head">
      <h3 class="modal-title">选择共享文件夹</h3>
      <button class="btn btn-ghost btn-sm" type="button" data-close>关闭</button>
    </div>
    <div class="pick-path" id="pickPath"></div>
    <div class="pick-list" id="pickList"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="pickUse" type="button" disabled>使用当前路径</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="/static/bus.js"></script>
<script src="/static/marked.min.js"></script>
<script src="/static/qrcode.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
